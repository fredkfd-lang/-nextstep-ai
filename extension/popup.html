<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BerOpp Autofill</title><style>body{font-family:Arial,sans-serif;width:320px;margin:0;padding:16px;color:#172033}h2{margin-top:0}button,input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border-radius:9px;border:1px solid #cbd5e1;font:inherit}button{background:#4f46e5;color:white;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eef2ff;color:#3730a3}.note{font-size:12px;color:#64748b;line-height:1.45}.status,.missing{padding:8px;background:#f1f5f9;border-radius:8px;font-size:12px;margin-top:8px;line-height:1.45}.missing{background:#fff7ed;color:#9a3412}</style></head><body><h2>🔐 BerOpp Autofill</h2><p class="note">Import your exported BerOpp profile once. The extension fills matching fields but never submits a form.</p><label for="profileFile">Profile export (.json)</label><input id="profileFile" type="file" accept="application/json,.json"><button id="import">Import profile</button><button id="fill">⚡ Fill form on this page</button><button class="secondary" id="clear">Delete extension profile</button><div id="status" class="status">No profile imported yet.</div><div id="missing" class="missing"></div><script src="popup.js"></script></body></html>
