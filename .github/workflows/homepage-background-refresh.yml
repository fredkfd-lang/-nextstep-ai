name: Apply BerOpp homepage background refresh

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "beropp-background-refresh"
  cancel-in-progress: true

jobs:
  refresh:
    if: !contains(github.event.head_commit.message, 'Apply BerOpp homepage background refresh')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh homepage background
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<style id="beropp-home-background-refresh">'
          if marker not in s:
              css = r'''
          <style id="beropp-home-background-refresh">
          body{
            background:
              radial-gradient(900px 500px at 8% 0%,rgba(186,230,253,.72),transparent 58%),
              radial-gradient(760px 520px at 96% 8%,rgba(224,231,255,.78),transparent 60%),
              linear-gradient(180deg,#fafdff 0%,#f3f8ff 45%,#eaf3ff 100%);
            background-attachment:fixed;
          }
          body:before{
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:-1;
            opacity:.48;
            background-image:
              linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
              linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px);
            background-size:34px 34px;
            mask-image:linear-gradient(to bottom,black,transparent 88%);
          }
          main{
            position:relative;
            isolation:isolate;
          }
          main:before,main:after{
            content:"";
            position:absolute;
            z-index:-1;
            border-radius:999px;
            filter:blur(2px);
            pointer-events:none;
          }
          main:before{
            width:260px;height:260px;
            right:-120px;top:110px;
            background:radial-gradient(circle,rgba(125,211,252,.30),transparent 68%);
          }
          main:after{
            width:300px;height:300px;
            left:-150px;top:620px;
            background:radial-gradient(circle,rgba(165,180,252,.22),transparent 70%);
          }
          .nsHero{
            background:
              radial-gradient(420px 260px at 88% 20%,rgba(255,255,255,.9),transparent 70%),
              linear-gradient(135deg,#ffffff 0%,#f0f9ff 42%,#dbeafe 100%);
            border:1px solid rgba(147,197,253,.55);
            box-shadow:0 20px 55px rgba(37,99,235,.12);
          }
          .nsHero:before{
            width:340px;height:340px;
            right:-130px;top:-170px;
            background:radial-gradient(circle,rgba(255,255,255,.92),transparent 68%);
          }
          .nsProfessor{
            box-shadow:0 18px 42px rgba(37,99,235,.13);
          }
          .card{
            backdrop-filter:blur(7px);
          }
          @media(max-width:680px){
            body{
              background:
                radial-gradient(520px 360px at 50% -40px,rgba(186,230,253,.55),transparent 72%),
                linear-gradient(180deg,#fafdff 0%,#eef6ff 100%);
            }
            main:before,main:after{display:none}
            .nsHero{box-shadow:0 14px 36px rgba(37,99,235,.10)}
          }
          body.dark-mode{
            background:
              radial-gradient(850px 500px at 8% 0%,rgba(30,64,175,.28),transparent 60%),
              radial-gradient(700px 480px at 95% 10%,rgba(76,29,149,.25),transparent 62%),
              linear-gradient(180deg,#08111f 0%,#0b1730 55%,#101f3d 100%);
          }
          body.dark-mode:before{
            background-image:
              linear-gradient(rgba(147,197,253,.035) 1px,transparent 1px),
              linear-gradient(90deg,rgba(147,197,253,.035) 1px,transparent 1px);
          }
          </style>
          '''
              s = s.replace("</head>", css + "</head>", 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit background refresh
        run: |
          git config user.name "BerOpp Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply BerOpp homepage background refresh"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
